name: Build PlayIt Clone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q PlayItClone.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          echo "Searching for settings.gradle.kts..."
          find project -name "settings.gradle.kts" -o -name "settings.gradle"

      - name: Set project directory
        run: |
          PROJECT_DIR=$(dirname "$(find project -name "settings.gradle.kts" -o -name "settings.gradle" | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayIt-Clone-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
